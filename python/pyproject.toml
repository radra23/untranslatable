[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "untranslatable"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "Flask>=3.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
    "opentelemetry-instrumentation-flask>=0.62b1",
    "opentelemetry-instrumentation-requests>=0.62b1",
    "opentelemetry-semantic-conventions>=0.62b1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0",
    "pytest-flask>=1.3",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/radra23/untranslatable/tree/main/python"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "data*"]

[tool.setuptools.package-data]
"data" = ["*.json"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle (NumPy convention configured below)
]
ignore = ["D415"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["api", "data", "telemetry"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
