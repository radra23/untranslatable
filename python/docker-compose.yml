services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    networks:
      - backend
    volumes:
      - "./otel-collector-config.yml:/etc/otelcol-contrib/config.yml"
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    ports:
      - "4317:4317"    # OTLP gRPC (APIs send here)
      - "4318:4318"    # OTLP HTTP
      - "8889:8889"    # Prometheus scrape endpoint
      - "13133:13133"  # health check
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:latest
    networks:
      - backend
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - "./tempo.yaml:/etc/tempo.yaml"
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"    # Tempo HTTP API (Grafana datasource)

  loki:
    image: grafana/loki:latest
    networks:
      - backend
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - "./loki.yaml:/etc/loki/loki.yaml"
      - loki-data:/loki
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:latest
    networks:
      - backend
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    networks:
      - backend
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - "./provisioning:/etc/grafana/provisioning"
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

networks:
  backend:

volumes:
  tempo-data:
  loki-data:
  grafana-data:
